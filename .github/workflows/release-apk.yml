name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew 2>/dev/null || true
          # Use gradle wrapper or install it
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          ./gradlew assembleRelease

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk \
             woorivote-v${{ steps.version.outputs.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "우리한표 v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 우리한표 v${{ steps.version.outputs.VERSION }}

            ### APK 설치 방법
            1. 아래 `woorivote-v${{ steps.version.outputs.VERSION }}.apk` 파일을 다운로드
            2. Android 기기에서 파일 실행
            3. "출처를 알 수 없는 앱" 설치 허용 후 설치

            ### iOS 사용자
            Safari에서 https://english-class-e059f.web.app 접속 후
            공유 버튼 → "홈 화면에 추가"로 PWA 설치
          files: woorivote-v${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
